name: Deploy application

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew test --no-daemon
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: corepack enable
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint && pnpm build
        working-directory: web

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: [secret-scan, verify]
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      server_digest: ${{ steps.server.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: server
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/da-care-server:${{ github.sha }}
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/da-care-web:${{ github.sha }}
      - name: 배포 키 설정
        if: vars.DEPLOY_HOST != ''
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: 운영 파일 전송
        if: vars.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          scp infra/production/bootstrap.sh infra/production/deploy.sh infra/production/Caddyfile infra/docker/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
      - name: 운영 런타임 초기화
        if: vars.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          printf '%s' "$APP_ENV" | base64 -w 0 | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'base64 --decode > /tmp/app.env && sudo bash /tmp/bootstrap.sh && sudo install -m 750 /tmp/deploy.sh /opt/dacare/bin/deploy && sudo install -m 644 /tmp/Caddyfile /opt/dacare/runtime/Caddyfile && sudo install -m 644 /tmp/docker-compose.prod.yml /opt/dacare/runtime/docker-compose.yml && sudo install -m 600 /tmp/app.env /opt/dacare/runtime/app.env'
      - name: digest 배포 및 원격 헬스체크
        if: vars.DEPLOY_HOST != ''
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/da-care-server@${{ steps.server.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/da-care-web@${{ steps.web.outputs.digest }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /opt/dacare/bin/deploy '$SERVER_IMAGE' '$WEB_IMAGE'"
