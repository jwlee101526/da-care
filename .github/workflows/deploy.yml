name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/ci.yml

  infrastructure:
    if: github.ref == 'refs/heads/production'
    needs: staging
    uses: ./.github/workflows/terraform.yml
    secrets: inherit

  deploy:
    if: github.ref == 'refs/heads/production'
    needs: infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ needs.infrastructure.outputs.public_ip }}
      DEPLOY_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: 필수 설정 확인 및 SSH 준비
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Terraform 운영 IP 출력이 필요합니다}"
          : "${SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY가 필요합니다}"
          : "${SSH_KNOWN_HOSTS:?DEPLOY_SSH_KNOWN_HOSTS가 필요합니다}"
          : "${APP_ENV:?APP_ENV가 필요합니다}"
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if ssh "$DEPLOY_USER@$DEPLOY_HOST" 'test "$(uname -m)" = aarch64 && sudo -n cloud-init status --wait'; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then echo '::error::운영 VM SSH/초기화 준비 실패'; exit 1; fi
            sleep 10
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: server
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
      - name: 운영 파일 전송
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'install -m 700 -d ~/dacare-deploy'
          scp infra/production/bootstrap.sh infra/production/deploy.sh infra/production/Caddyfile infra/docker/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:dacare-deploy/"
      - name: 운영 설정 적용
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          printf '%s\n' "$APP_ENV" | ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            umask 077
            trap "rm -f ~/dacare-deploy/app.env" EXIT
            cat > ~/dacare-deploy/app.env
            sudo bash ~/dacare-deploy/bootstrap.sh
            sudo install -m 750 ~/dacare-deploy/deploy.sh /opt/dacare/bin/deploy
            sudo install -m 644 ~/dacare-deploy/Caddyfile /opt/dacare/runtime/Caddyfile
            sudo install -m 644 ~/dacare-deploy/docker-compose.prod.yml /opt/dacare/runtime/docker-compose.yml
            sudo install -m 600 ~/dacare-deploy/app.env /opt/dacare/runtime/app.env
          '
      - name: 이미지 배포 및 HTTPS 확인
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          SERVER_IMAGE: ${{ env.IMAGE_PREFIX }}-server@${{ steps.server.outputs.digest }}
          WEB_IMAGE: ${{ env.IMAGE_PREFIX }}-web@${{ steps.web.outputs.digest }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /opt/dacare/bin/deploy '$SERVER_IMAGE' '$WEB_IMAGE' '$GHCR_USERNAME'"
