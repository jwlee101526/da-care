name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/production'
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'asia-northeast3' }}
      TF_VAR_revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: 최초 설정 확인
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          : "${TF_VAR_project_id:?infra/cloud-run/bootstrap.sh를 먼저 실행하세요}"
          : "${WIF_PROVIDER:?infra/cloud-run/bootstrap.sh를 먼저 실행하세요}"
          echo "IMAGE=$TF_VAR_region-docker.pkg.dev/$TF_VAR_project_id/dacare/app:$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: 통합 이미지 빌드
        run: docker build --tag "$IMAGE" .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: dacare-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: 이미지 업로드
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$TF_VAR_region-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          digest=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')
          test -n "$digest"
          echo "TF_VAR_image=${IMAGE%:*}@$digest" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - name: Terraform 배포
        working-directory: infra/cloud-run
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="bucket=$TF_VAR_project_id-dacare-tfstate" -backend-config='prefix=cloud-run/production'
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out="$RUNNER_TEMP/production.tfplan"
          terraform show -json "$RUNNER_TEMP/production.tfplan" | jq -e '[.resource_changes[]? | select(.change.actions | index("delete"))] | length == 0' >/dev/null
          terraform apply -input=false "$RUNNER_TEMP/production.tfplan"
          echo "APP_URL=$(terraform output -raw url)" >> "$GITHUB_ENV"
      - name: 화면과 DB 연결 확인
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "$APP_URL/actuator/health" | jq -e '.status == "UP"'
          curl --fail --silent --show-error "$APP_URL/" | grep -q '<div id="root">'
          curl --fail --silent --show-error "$APP_URL/reserve" | grep -q '<div id="root">'
          printf '### 배포 완료\n\n%s\n' "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: 임시 plan 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/production.tfplan"
