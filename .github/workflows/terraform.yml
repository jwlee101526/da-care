name: Terraform

on:
  pull_request:
    branches: [staging, production]
    paths: [infra/terraform/**, infra/production/**]
  push:
    branches: [staging, production]
    paths: [infra/terraform/**, infra/production/**]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [staging, production]
    environment: terraform-${{ matrix.environment }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: OCI API 키 설정
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
      - name: backend 설정
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TF_STATE_NAMESPACE: ${{ vars.TF_STATE_NAMESPACE }}
          TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "dacare/${{ matrix.environment }}/terraform.tfstate"
          region = "$TF_STATE_REGION"
          access_key = "$TF_STATE_ACCESS_KEY"
          secret_key = "$TF_STATE_SECRET_KEY"
          skip_credentials_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          skip_region_validation = true
          use_path_style = true
          endpoints = { s3 = "https://$TF_STATE_NAMESPACE.compat.objectstorage.$TF_STATE_REGION.oraclecloud.com" }
          EOF
          terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Terraform 형식 및 plan
        env:
          TF_VAR_environment: ${{ matrix.environment }}
          TF_VAR_region: ${{ vars.OCI_REGION }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_api_key_fingerprint: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
          TF_VAR_api_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
          TF_VAR_deploy_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
          TF_VAR_domain: ${{ vars.APP_DOMAIN }}
          TF_VAR_vault_secret_ocid: ${{ secrets.VAULT_SECRET_OCID }}
          TF_VAR_vault_compartment_id: ${{ secrets.OCI_VAULT_COMPARTMENT_OCID }}
        run: |
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -no-color -out="$RUNNER_TEMP/plan"

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: terraform-${{ github.ref_name }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: OCI API 키와 backend 설정
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TF_STATE_NAMESPACE: ${{ vars.TF_STATE_NAMESPACE }}
          TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "dacare/${{ github.ref_name }}/terraform.tfstate"
          region = "$TF_STATE_REGION"
          access_key = "$TF_STATE_ACCESS_KEY"
          secret_key = "$TF_STATE_SECRET_KEY"
          skip_credentials_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          skip_region_validation = true
          use_path_style = true
          endpoints = { s3 = "https://$TF_STATE_NAMESPACE.compat.objectstorage.$TF_STATE_REGION.oraclecloud.com" }
          EOF
          terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Terraform apply
        env:
          TF_VAR_environment: ${{ github.ref_name }}
          TF_VAR_region: ${{ vars.OCI_REGION }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_api_key_fingerprint: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
          TF_VAR_api_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
          TF_VAR_deploy_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
          TF_VAR_domain: ${{ vars.APP_DOMAIN }}
          TF_VAR_vault_secret_ocid: ${{ secrets.VAULT_SECRET_OCID }}
          TF_VAR_vault_compartment_id: ${{ secrets.OCI_VAULT_COMPARTMENT_OCID }}
        run: |
          terraform fmt -check -recursive
          terraform validate
          terraform apply -input=false -auto-approve
