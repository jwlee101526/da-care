name: Provision OCI

on:
  workflow_call:
    outputs:
      public_ip:
        description: 운영 VM 공인 IP
        value: ${{ jobs.apply.outputs.public_ip }}

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    outputs:
      public_ip: ${{ steps.outputs.outputs.public_ip }}
    env:
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - name: OCI API key 설정
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          : "${OCI_API_PRIVATE_KEY:?OCI_API_PRIVATE_KEY가 필요합니다}"
          umask 077
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
      - name: Terraform 초기화와 적용
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.OCI_REGION }}
          TF_STATE_NAMESPACE: ${{ vars.TF_STATE_NAMESPACE }}
          TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          TF_VAR_region: ${{ vars.OCI_REGION }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_api_key_fingerprint: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
          TF_VAR_api_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR || '0.0.0.0/0' }}
        run: |
          set -euo pipefail
          for name in TF_STATE_BUCKET TF_STATE_REGION TF_STATE_NAMESPACE TF_STATE_ACCESS_KEY TF_STATE_SECRET_KEY TF_VAR_region TF_VAR_tenancy_ocid TF_VAR_compartment_id TF_VAR_user_ocid TF_VAR_api_key_fingerprint TF_VAR_ssh_public_key; do
            if [[ -z "${!name}" ]]; then echo "::error::$name 설정이 필요합니다"; exit 1; fi
          done
          umask 077
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "dacare/production/terraform.tfstate"
          region = "$TF_STATE_REGION"
          access_key = "$TF_STATE_ACCESS_KEY"
          secret_key = "$TF_STATE_SECRET_KEY"
          skip_credentials_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          skip_region_validation = true
          skip_s3_checksum = true
          use_path_style = true
          endpoints = { s3 = "https://$TF_STATE_NAMESPACE.compat.objectstorage.$TF_STATE_REGION.oraclecloud.com" }
          EOF
          terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out="$RUNNER_TEMP/production.tfplan"
          terraform show -json "$RUNNER_TEMP/production.tfplan" | jq -e '
            [.resource_changes[]? | select(.change.actions | index("delete"))] | length == 0
          ' >/dev/null || { echo '::error::리소스 삭제/교체가 포함되어 자동 적용을 중단합니다. plan을 확인하세요.'; exit 1; }
          terraform apply -input=false "$RUNNER_TEMP/production.tfplan"
      - name: 운영 IP 전달
        id: outputs
        run: |
          public_ip=$(terraform output -raw public_ip)
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"
          printf '운영 공인 IP: %s\n' "$public_ip"
      - name: 임시 자격증명 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/oci_api_key.pem" "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/production.tfplan"
