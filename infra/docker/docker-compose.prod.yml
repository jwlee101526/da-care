services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ./deploy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file:
      - ./app.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - server

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
