services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dacare}
      POSTGRES_USER: ${POSTGRES_USER:-dacare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacare-dev-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ../../server
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dacare}
      DB_USERNAME: ${POSTGRES_USER:-dacare}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dacare-dev-password}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - server

volumes:
  postgres-data:
