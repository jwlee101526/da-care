<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speaker-cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cone-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- 1. 좌측 사운드 웨이브 (완벽한 좌우 대칭 - 2단계 아치) -->
  <!-- 좌측 바깥쪽 파동 -->
  <path d="M4 15C1 20 1 30 4 35" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- 좌측 안쪽 파동 -->
  <path d="M8 19C6 23 6 27 8 31" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- 2. 중앙 오디오 스피커 본체 (정중앙 24px 기준 정렬) -->
  <rect x="12" y="6" width="24" height="36" rx="4.5" fill="url(#speaker-cabinet)" stroke="#334155" stroke-width="1.2"/>

  <!-- 상단 소형 고음 트위터 (Tweeter) -->
  <circle cx="24" cy="15" r="4.2" fill="#334155" stroke="#475569" stroke-width="1"/>
  <circle cx="24" cy="15" r="1.8" fill="#38bdf8"/>

  <!-- 하단 대형 중저음 우퍼 (Subwoofer Cone) -->
  <circle cx="24" cy="28.5" r="8" fill="url(#cone-rim)" stroke="#60a5fa" stroke-width="1.2"/>
  <circle cx="24" cy="28.5" r="4.8" fill="#0f172a"/>
  <circle cx="24" cy="28.5" r="2" fill="#38bdf8"/>

  <!-- 상단 중앙 볼륨 휠 / 스마트 LED -->
  <rect x="22" y="7.5" width="4" height="1.5" rx="0.75" fill="#64748b"/>

  <!-- 3. 우측 사운드 웨이브 (완벽한 좌우 대칭 - 2단계 아치) -->
  <!-- 우측 안쪽 파동 -->
  <path d="M40 19C42 23 42 27 40 31" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- 우측 바깥쪽 파동 -->
  <path d="M44 15C47 20 47 30 44 35" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
</svg>
