<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tv-screen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="stand-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- 1. 초슬림 블랙 베젤 TV 본체 (16:9 와이드 비율) -->
  <rect x="3" y="6" width="42" height="27" rx="2.5" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

  <!-- 2. 대형 4K 스마트 디스플레이 패널 -->
  <rect x="4.5" y="7.5" width="39" height="23" rx="1.5" fill="url(#tv-screen-bg)"/>

  <!-- 3. 스마트 TV 화면 속 스트리밍 UI - 중앙 플레이 아이콘 -->
  <circle cx="24" cy="16" r="4.5" fill="#2563eb" fill-opacity="0.9"/>
  <polygon points="23,13.8 23,18.2 26.5,16" fill="#ffffff"/>

  <!-- 4. 하단 스마트 앱 허브 카드 목록 (OTT / 채널) -->
  <rect x="7" y="23" width="7" height="4.5" rx="1" fill="#ef4444" fill-opacity="0.85"/>
  <rect x="16" y="23" width="7" height="4.5" rx="1" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="25" y="23" width="7" height="4.5" rx="1" fill="#0284c7" fill-opacity="0.85"/>
  <rect x="34" y="23" width="7" height="4.5" rx="1" fill="#10b981" fill-opacity="0.85"/>

  <!-- 5. TV 하단 중앙 대기전원 LED & 리모컨 수신부 -->
  <circle cx="24" cy="33" r="0.75" fill="#38bdf8"/>

  <!-- 6. 스마트 TV 전용 메탈 스탠드 (넥 & 평면 플레이트 받침대) -->
  <rect x="22.5" y="33" width="3" height="4" fill="#475569"/>
  <path d="M15 37H33L34.5 40C34.7 40.4 34.4 41 33.9 41H14.1C13.6 41 13.3 40.4 13.5 40L15 37Z" fill="url(#stand-metal)" stroke="#64748b" stroke-width="0.8"/>
</svg>
