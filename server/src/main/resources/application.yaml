spring:
  application:
    name: server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    tools:
      throw-exception-on-error: false
      # 상담 1회의 도구 호출 한도. 초과하면 요청을 실패시키지 않고 모델에 한도 초과를 알려 답변을 마무리하게 한다.
      limits:
        max-total-tool-calls: 8
        max-calls-per-tool-default: 3
        on-limit-exceeded: return-error-response
    openai:
      api-key: ${OPENAI_API_KEY}
      # 모델 호출 1회 기준. 도구 호출마다 모델을 다시 호출하므로 전체 상담 기한은 app.diagnosis.timeout으로 제한한다.
      timeout: 25s
      max-retries: 1
      chat:
        model: gpt-5-mini
        reasoning-effort: low
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        dimensions: 1536

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  demo-data:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
  web:
    port: ${WEB_PORT:3000}
  diagnosis:
    # 상담 요청 전체 기한. 웹 클라이언트 제한 시간(90초)보다 짧아야 서버의 시간 초과 안내가 전달된다.
    timeout: ${DIAGNOSIS_TIMEOUT:75s}
    # text-embedding-3-small 기준 관련 문서 유사도 하한. 모델 변경 시 운영 질의로 재조정한다.
    similarity-threshold: ${DIAGNOSIS_SIMILARITY_THRESHOLD:0.4}
  usage:
    # 유료 API의 주간 호출 한도. 매주 월요일 0시(한국 시간)에 초기화된다.
    # AI 상담은 사용자 한도(계정 또는 비로그인 IP)와 서비스 전체 한도를 모두 통과해야 한다.
    weekly-limit:
      diagnosis-total: ${DIAGNOSIS_WEEKLY_LIMIT:200}
      diagnosis-customer: ${DIAGNOSIS_CUSTOMER_WEEKLY_LIMIT:10}
      diagnosis-admin: ${DIAGNOSIS_ADMIN_WEEKLY_LIMIT:200}
      diagnosis-guest: ${DIAGNOSIS_GUEST_WEEKLY_LIMIT:5}
      sms: ${SMS_WEEKLY_LIMIT:15}
    # 앞단 프록시가 덮어써 위조할 수 없는 실제 클라이언트 IP 헤더(Render: True-Client-IP).
    # 비우면 server.forward-headers-strategy로 구한 원격 주소를 쓴다.
    client-ip-header: ${CLIENT_IP_HEADER:}
    # 비로그인 사용자 IP를 저장 전에 해시하는 비밀값. 지정하지 않으면 JWT 비밀값을 쓴다.
    ip-hash-secret: ${USAGE_IP_HASH_SECRET:${app.jwt.secret}}
