spring:
  application:
    name: server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    tools:
      throw-exception-on-error: true
      limits:
        max-total-tool-calls: 8
        max-calls-per-tool-default: 3
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: 30s
      max-retries: 0
      chat:
        reasoning-effort: low
    vectorstore:
      mariadb:
        initialize-schema: true
        distance-type: COSINE
        dimensions: 1536

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-that-is-long-enough-for-hmac-signing-key}
    expiration: ${JWT_EXPIRATION:PT8H}
  admin:
    email: ${ADMIN_EMAIL:admin@decare.com}
    password: ${ADMIN_PASSWORD:admin1234}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  web:
    port: ${WEB_PORT:3000}
