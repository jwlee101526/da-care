spring:
  application:
    name: server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    tools:
      throw-exception-on-error: false
      limits:
        max-total-tool-calls: 8
        max-calls-per-tool-default: 3
    openai:
      api-key: ${OPENAI_API_KEY}
      # 모델 호출 1회 기준. 도구 호출마다 모델을 다시 호출하므로 전체 상담 기한은 app.diagnosis.timeout으로 제한한다.
      timeout: 25s
      max-retries: 1
      chat:
        reasoning-effort: low
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        dimensions: 1536

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  demo-data:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
  web:
    port: ${WEB_PORT:3000}
  diagnosis:
    # 상담 요청 전체 기한. 웹 클라이언트 제한 시간(90초)보다 짧아야 서버의 시간 초과 안내가 전달된다.
    timeout: ${DIAGNOSIS_TIMEOUT:75s}
    # text-embedding-3-small 기준 관련 문서 유사도 하한. 모델 변경 시 운영 질의로 재조정한다.
    similarity-threshold: ${DIAGNOSIS_SIMILARITY_THRESHOLD:0.4}
