spring:
  application:
    name: server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    tools:
      throw-exception-on-error: true
      limits:
        max-total-tool-calls: 8
        max-calls-per-tool-default: 3
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: 30s
      max-retries: 0
      chat:
        reasoning-effort: low
    vectorstore:
      mariadb:
        initialize-schema: true
        distance-type: COSINE
        dimensions: 1536

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  demo-data:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
    kakao-pf-id: ${SOLAPI_KAKAO_PF_ID:}
    kakao-template-id: ${SOLAPI_KAKAO_TEMPLATE_ID:}
  web:
    port: ${WEB_PORT:3000}
